<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <div class="main container-lg">

        <div class="position-relative search-box">
            <input type="text" class="form-control pe-6 search-inp" placeholder="Search city...">

            <button class="btn btn-primary position-absolute top-50 end-0 translate-middle-y me-1 search" type="button">
                Search
            </button>
        </div>
        <br>

        <div class="container-lg sec-container">
            <div class="location container-lg">
                <div class="city">
                    <div class="icon"><i class="fa-solid fa-location-dot"></i></div>

                    <h3 class="location-name">Bahawalpur , Pakistan</h3>
                </div>
                <div class="date">Mon , 17 Augest</div>
            </div>
            <div class="inner container-lg">
                <div class="left container-lg">
                    <div class="img "><img src="asset/sun-removebg-preview.png" alt="" height="140px"></div>
                    <div class="temperature">
                        <span class="Temp">32</span><span class="unit">°C</span>
                        <p>Clear Sky</p>
                    </div>
                </div>
                <div class="right container-lg">
                    <div class="about-weather">
                        <div class="condtion-1 condtion">
                            <div class="condtion-left">
                                <div class="icon"><i class="fa-solid fa-droplet" style="color: blue;"></i></div>
                                <p class="m-0 ">Humidity</p>
                            </div>
                            <p class="m-0 humidity ">45%</p>
                        </div>
                        <div class="condtion-2 condtion">
                            <div class="condtion-left">
                                <div class="icon"><i class="fa-solid fa-wind" style="color: rgb(17, 201, 78);"></i>
                                </div>
                                <p class="m-0 windSpeed">Wind</p>
                            </div>
                            <p class="m-0">12km/h</p>
                        </div>
                        <div class="condtion-3 condtion">
                            <div class="condtion-left">
                                <div class="icon"><i class="fa-solid fa-temperature-half"
                                        style="color: rgb(255, 0, 0);"></i>
                                </div>
                                <p class="m-0">Feelslike</p>
                            </div>
                            <p class="m-0 feellike">35 C</p>
                        </div>
                        <div class="condtion-4 condtion">
                            <div class="condtion-left">
                                <div class="icon"><i class="fa-solid fa-cloud-showers-heavy" style="color: blue;"></i>
                                </div>
                                <p class="m-0 rain">Rainchance</p>
                            </div>
                            <p class="m-0">10%</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="tablet-condition">
            <div class="box box1">
                <div class="icon"><i class="fa-solid fa-droplet" style="color: blue;"></i></div>
                <div class="condition-box">
                    <p class="m-0">Humitidy</p>
                    <p class="m-0 humidity ">45</p>
                </div>
            </div>
            <div class="box box2">
                <div class="icon"><i class="fa-solid fa-wind" style="color: rgb(17, 201, 78);"></i></div>
                <div class="condition-box">
                    <p class="m-0">Wind</p>
                    <p class="m-0 windSpeed">12 km/h</p>
                </div>
            </div>
            <div class="box box3">
                <div class="icon"><i class="fa-solid fa-temperature-half" style="color: rgb(255, 0, 0);"></i></div>
                <div class="condition-box">
                    <p class="m-0">Feelike</p>
                    <p class="m-0 feellike">35 C</p>
                </div>
            </div>
            <div class="box box4">
                <div class="icon"><i class="fa-solid fa-cloud-showers-heavy" style="color: blue;"></i></div>
                <div class="condition-box">
                    <p class="m-0">Rainchance</p>
                    <p class="m-0">25%</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="App.js"></script>
</body>

</html>
