<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <div class="main container-lg">

        <div class="position-relative search-box">
            <input type="text" class="form-control pe-6 search-inp" placeholder="Search city...">

            <button class="btn btn-primary position-absolute top-50 end-0 translate-middle-y me-1" type="button">
                Search
            </button>
        </div>
        <br>

        <div class="container-lg sec-container">
            <div class="location container-lg">
                <div class="city">
                    <div class="icon"><i class="fa-solid fa-location-dot"></i></div>

                    <h3>Lahore , Pakistan</h3>
                </div>
                <div class="date">Sunday , 15 Aug</div>
            </div>
            <div class="inner container-lg">
                <div class="left container-lg">
                    <div class="img "><img src="asset/sun-removebg-preview.png" alt="" height="120px"></div>
                    <div class="temperature">
                        <h1>32 <span><sup>.</sup>C</span></h1>
                        <p>Clear Sky</p>
                    </div>
                </div>
                <div class="right container-lg">
                    <div class="about-weather">
                        <div class="condtion-1 condtion"></div>
                        <div class="condtion-2 condtion"></div>
                        <div class="condtion-3 condtion"></div>
                        <div class="condtion-4 condtion"></div>
                    </div>
                </div>
            </div>

        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="App.js"></script>
</body>

</html>
